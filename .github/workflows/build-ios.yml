name: Boom Music - Auto Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show repository
        run: |
          echo "===== REPOSITORY ====="
          find . -maxdepth 3 -type f | sort

      - name: Prepare Boom Music
        shell: bash
        run: |
          set -e

          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/
          else
            echo "index.html belum ada."
            echo "Workflow tidak akan membuat project palsu."
            echo ""
            echo "Masukkan project Boom Music ke root repository."
            exit 1
          fi

          [ -f style.css ] && cp style.css www/ || true
          [ -f app.js ] && cp app.js www/ || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f service-worker.js ] && cp service-worker.js www/ || true

          [ -d js ] && cp -R js www/ || true
          [ -d assets ] && cp -R assets www/ || true

      - name: Create package.json
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ibaal.boommusic",
            "appName": "Boom Music",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add iOS
        run: |
          npx cap add ios

      - name: Sync iOS
        run: |
          npx cap sync ios

      - name: Install Pods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -o pipefail

          mkdir -p ios/App/output

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/ios/App/output/BoomMusic.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=15.5 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        shell: bash
        run: |
          set -e

          cd ios/App

          rm -rf Payload
          mkdir Payload

          cp -R \
            output/BoomMusic.xcarchive/Products/Applications/App.app \
            Payload/BoomMusic.app

          zip -r \
            "$GITHUB_WORKSPACE/BoomMusic-unsigned.ipa" \
            Payload

          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic-unsigned.ipa
