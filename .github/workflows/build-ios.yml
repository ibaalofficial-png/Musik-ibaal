name: Build Boom Music iOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Boom Music iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Xcode:"
          xcodebuild -version
          xcode-select -p

      - name: Inspect Project
        run: |
          set -e
          test -d "BoomMusicNative/BoomMusicNative.xcodeproj"
          xcodebuild -list             -project "BoomMusicNative/BoomMusicNative.xcodeproj"

      - name: Build Unsigned App
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build/DerivedData build/App

          xcodebuild             -project "BoomMusicNative/BoomMusicNative.xcodeproj"             -scheme "BoomMusicNative"             -configuration Release             -sdk iphoneos             -derivedDataPath "$PWD/build/DerivedData"             CONFIGURATION_BUILD_DIR="$PWD/build/App"             ALWAYS_SEARCH_USER_PATHS=NO             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build             2>&1 | tee build/xcodebuild.log

      - name: Locate App
        shell: bash
        run: |
          set -e

          APP_PATH="$(find "$PWD/build" -type d -name "*.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "::error::Build selesai tetapi .app tidak ditemukan."
            echo "=== Last 200 log lines ==="
            tail -200 build/xcodebuild.log || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Found: $APP_PATH"

      - name: Create Unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf build/Payload
          mkdir -p build/Payload

          cp -R "$APP_PATH" build/Payload/

          cd build
          zip -qry "BoomMusicNative-unsigned.ipa" Payload

          test -f "BoomMusicNative-unsigned.ipa"
          ls -lh "BoomMusicNative-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusicNative-unsigned
          path: build/BoomMusicNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusicNative-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
