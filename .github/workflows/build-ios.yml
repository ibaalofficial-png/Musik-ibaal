name: Boom Music - Build IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    defaults:
      run:
        shell: bash

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BoomMusicNative/package-lock.json

      # ==========================================
      # CHECK PROJECT
      # ==========================================
      - name: Check Boom Music project
        run: |
          set -e

          echo "=========================================="
          echo "BOOM MUSIC PROJECT CHECK"
          echo "=========================================="

          if [ ! -d "BoomMusicNative" ]; then
            echo "ERROR: Folder BoomMusicNative tidak ditemukan."
            exit 1
          fi

          if [ ! -f "BoomMusicNative/index.html" ]; then
            echo "ERROR: BoomMusicNative/index.html tidak ditemukan."
            exit 1
          fi

          echo "OK: index.html ditemukan."

          echo
          echo "Project contents:"
          find BoomMusicNative -maxdepth 2 -type f | sort

      # ==========================================
      # INSTALL NPM
      # ==========================================
      - name: Install dependencies
        working-directory: BoomMusicNative
        run: |
          set -e

          if [ -f package-lock.json ]; then
            echo "package-lock.json ditemukan."
            npm ci
          elif [ -f package.json ]; then
            echo "package-lock.json tidak ditemukan."
            echo "Menggunakan npm install."
            npm install
          else
            echo "Tidak ada package.json."
            echo "Melanjutkan karena project dapat berupa native/static project."
          fi

      # ==========================================
      # CAPACITOR SYNC
      # ==========================================
      - name: Sync Capacitor iOS
        working-directory: BoomMusicNative
        run: |
          set -e

          if [ -f capacitor.config.json ] || [ -f capacitor.config.ts ]; then
            echo "Capacitor configuration ditemukan."

            if [ -d "ios" ]; then
              echo "Folder ios sudah ada."
              npx cap sync ios
            else
              echo "Folder ios belum ada."

              if [ -f package.json ]; then
                npx cap add ios
                npx cap sync ios
              else
                echo "ERROR: Tidak bisa membuat project iOS tanpa package.json."
                exit 1
              fi
            fi
          else
            echo "Tidak ada konfigurasi Capacitor."
            echo "Menggunakan project iOS yang sudah tersedia."
          fi

      # ==========================================
      # FIND IOS PROJECT
      # ==========================================
      - name: Locate iOS project
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING IOS PROJECT"
          echo "=========================================="

          WORKSPACE=$(find BoomMusicNative -name "*.xcworkspace" -type d | head -n 1 || true)
          PROJECT=$(find BoomMusicNative -name "*.xcodeproj" -type d | head -n 1 || true)

          if [ -n "$WORKSPACE" ]; then
            echo "Workspace ditemukan:"
            echo "$WORKSPACE"
            echo "IOS_WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"
          elif [ -n "$PROJECT" ]; then
            echo "Project ditemukan:"
            echo "$PROJECT"
            echo "IOS_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          else
            echo "ERROR: Xcode project/workspace tidak ditemukan."
            find BoomMusicNative -maxdepth 6 -type d \
              \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print
            exit 1
          fi

      # ==========================================
      # POD INSTALL
      # ==========================================
      - name: Install CocoaPods
        run: |
          set -e

          if [ -n "${IOS_WORKSPACE:-}" ]; then
            IOS_DIR="$(dirname "$IOS_WORKSPACE")"
          elif [ -n "${IOS_PROJECT:-}" ]; then
            IOS_DIR="$(dirname "$IOS_PROJECT")"
          else
            exit 1
          fi

          echo "iOS directory:"
          echo "$IOS_DIR"

          if [ -f "$IOS_DIR/Podfile" ]; then
            echo "Podfile ditemukan."
            cd "$IOS_DIR"

            pod install --repo-update
          else
            echo "Podfile tidak ditemukan."
            echo "Melewati CocoaPods."
          fi

      # ==========================================
      # ARCHIVE
      # ==========================================
      - name: Archive iOS app
        run: |
          set -e

          mkdir -p output

          if [ -n "${IOS_WORKSPACE:-}" ]; then

            WORKSPACE_NAME="$IOS_WORKSPACE"

            SCHEME=$(xcodebuild \
              -workspace "$WORKSPACE_NAME" \
              -list |
              awk '/Schemes:/{flag=1;next} flag && NF {print $1; exit}')

            if [ -z "$SCHEME" ]; then
              echo "ERROR: Scheme tidak ditemukan."
              xcodebuild -workspace "$WORKSPACE_NAME" -list
              exit 1
            fi

            echo "Workspace: $WORKSPACE_NAME"
            echo "Scheme: $SCHEME"

            xcodebuild \
              -workspace "$WORKSPACE_NAME" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$GITHUB_WORKSPACE/output/BoomMusic.xcarchive" \
              IPHONEOS_DEPLOYMENT_TARGET=15.5 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive

          elif [ -n "${IOS_PROJECT:-}" ]; then

            PROJECT_NAME="$IOS_PROJECT"

            SCHEME=$(xcodebuild \
              -project "$PROJECT_NAME" \
              -list |
              awk '/Schemes:/{flag=1;next} flag && NF {print $1; exit}')

            if [ -z "$SCHEME" ]; then
              echo "ERROR: Scheme tidak ditemukan."
              xcodebuild -project "$PROJECT_NAME" -list
              exit 1
            fi

            echo "Project: $PROJECT_NAME"
            echo "Scheme: $SCHEME"

            xcodebuild \
              -project "$PROJECT_NAME" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath "$GITHUB_WORKSPACE/output/BoomMusic.xcarchive" \
              IPHONEOS_DEPLOYMENT_TARGET=15.5 \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              archive

          else
            echo "ERROR: Tidak ada Xcode project."
            exit 1
          fi

      # ==========================================
      # CREATE UNSIGNED IPA
      # ==========================================
      - name: Create IPA
        run: |
          set -e

          ARCHIVE="output/BoomMusic.xcarchive"

          if [ ! -d "$ARCHIVE" ]; then
            echo "ERROR: Archive tidak ditemukan."
            exit 1
          fi

          APP_PATH="$ARCHIVE/Products/Applications/App.app"

          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$ARCHIVE/Products/Applications" \
              -maxdepth 1 \
              -name "*.app" \
              -type d |
              head -n 1)
          fi

          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app tidak ditemukan."
            find "$ARCHIVE/Products" -maxdepth 3 -print
            exit 1
          fi

          echo "App ditemukan:"
          echo "$APP_PATH"

          rm -rf output/Payload
          mkdir -p output/Payload

          cp -R "$APP_PATH" output/Payload/

          cd output

          zip -qry BoomMusic-unsigned.ipa Payload

          rm -rf Payload

          echo
          echo "=========================================="
          echo "IPA CREATED"
          echo "=========================================="

          ls -lh BoomMusic-unsigned.ipa

      # ==========================================
      # UPLOAD ARTIFACT
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: output/BoomMusic-unsigned.ipa
          if-no-files-found: error

      # ==========================================
      # UPLOAD ARCHIVE
      # ==========================================
      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-XCArchive
          path: output/BoomMusic.xcarchive
          if-no-files-found: error
