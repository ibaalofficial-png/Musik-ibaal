      - name: Prepare web directory and Capacitor
        shell: bash
        run: |
          set -e

          echo "===== PREPARING WEB APP ====="

          mkdir -p www

          # Copy project web files ke folder yang valid untuk Capacitor
          if [ -f index.html ]; then
            cp index.html www/
          fi

          if [ -f style.css ]; then
            cp style.css www/
          fi

          if [ -f app.js ]; then
            cp app.js www/
          fi

          if [ -d assets ]; then
            cp -R assets www/
          fi

          if [ -d js ]; then
            cp -R js www/
          fi

          if [ -d data ]; then
            cp -R data www/
          fi

          if [ -f manifest.json ]; then
            cp manifest.json www/
          fi

          if [ -f service-worker.js ]; then
            cp service-worker.js www/
          fi

          echo "===== WWW CONTENT ====="
          find www -maxdepth 4 -type f | sort
          echo "======================="

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ibaal.boommusic",
            "appName": "Boom Music",
            "webDir": "www"
          }
          EOF

          echo "===== CAPACITOR CONFIG ====="
          cat capacitor.config.json
          echo "============================"
