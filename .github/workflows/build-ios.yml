name: Build Boom Music iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check project
        run: |
          echo "===== PROJECT ====="
          pwd
          ls -la
          echo "==================="

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Capacitor CLI
        run: |
          if [ -f package.json ]; then
            npm install @capacitor/cli @capacitor/core @capacitor/ios
          fi

      - name: Build web project
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No web build script found - using existing web files"
          fi

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Show iOS structure
        run: |
          echo "===== iOS ====="
          find ios -maxdepth 4 -type f | sort | head -300
          echo "==============="

      - name: Find workspace
        id: workspace
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" -type d | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: No .xcworkspace found"
            exit 1
          fi

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "Workspace: $WORKSPACE"

      - name: Find scheme
        id: scheme
        run: |
          WORKSPACE="${{ steps.workspace.outputs.workspace }}"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -list

      - name: Clean
        run: |
          WORKSPACE="${{ steps.workspace.outputs.workspace }}"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            clean

      - name: Archive
        run: |
          WORKSPACE="${{ steps.workspace.outputs.workspace }}"

          mkdir -p output

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/output/BoomMusic.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=15.5 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create unsigned IPA
        run: |
          set -e

          ARCHIVE="output/BoomMusic.xcarchive"
          APP_PATH="$ARCHIVE/Products/Applications/App.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app not found"
            find "$ARCHIVE" -maxdepth 5 -type d
            exit 1
          fi

          mkdir -p output/Payload

          cp -R "$APP_PATH" output/Payload/BoomMusic.app

          cd output
          zip -r BoomMusic-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-iOS
          path: output/BoomMusic-unsigned.ipa
          if-no-files-found: error

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-XCArchive
          path: output/BoomMusic.xcarchive
          if-no-files-found: error
