name: Boom Music Build IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Boom Music web project
        shell: bash
        run: |
          set -e

          echo "=== SEARCH INDEX.HTML ==="

          INDEX=$(find . \
            -type f \
            -name "index.html" \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html tidak ditemukan di repository."
            echo
            echo "Isi repository:"
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          echo "index.html ditemukan:"
          echo "$INDEX"

          WEB_DIR=$(dirname "$INDEX")

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Capacitor
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          echo "Web directory:"
          pwd

          echo "Files:"
          ls -la

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Create Capacitor config
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ibaal.boommusic",
            "appName": "Boom Music",
            "webDir": "."
          }
          EOF

          cat capacitor.config.json

      - name: Create iOS project
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          if [ ! -d ios ]; then
            npx cap add ios
          fi

          npx cap sync ios

      - name: Find Xcode workspace
        shell: bash
        run: |
          set -e

          WORKSPACE=$(find "$WEB_DIR/ios" \
            -name "*.xcworkspace" \
            -type d \
            | head -1)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Xcode workspace tidak ditemukan."
            find "$WEB_DIR/ios" -maxdepth 4 -print
            exit 1
          fi

          echo "WORKSPACE=$WORKSPACE" >> "$GITHUB_ENV"

          echo "Workspace:"
          echo "$WORKSPACE"

      - name: Build iOS
        shell: bash
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/output"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/output/BoomMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Create IPA
        shell: bash
        run: |
          set -e

          ARCHIVE="$GITHUB_WORKSPACE/output/BoomMusic.xcarchive"

          APP=$(find "$ARCHIVE/Products/Applications" \
            -name "*.app" \
            -type d \
            | head -1)

          if [ -z "$APP" ]; then
            echo "ERROR: .app tidak ditemukan."
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/output/Payload"

          mkdir -p "$GITHUB_WORKSPACE/output/Payload"

          cp -R "$APP" \
            "$GITHUB_WORKSPACE/output/Payload/"

          cd "$GITHUB_WORKSPACE/output"

          zip -qry BoomMusic.ipa Payload

          rm -rf Payload

          echo "================================"
          echo "IPA BERHASIL DIBUAT"
          echo "================================"

          ls -lh BoomMusic.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: output/BoomMusic.ipa
          if-no-files-found: error
