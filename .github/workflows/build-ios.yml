name: Boom Music Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "Checking BoomMusicNative..."
          ls -la
          ls -la BoomMusicNative

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: BoomMusicNative
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json - skipping npm"
          fi

      - name: Check iOS
        working-directory: BoomMusicNative
        run: |
          if [ -d ios ]; then
            echo "iOS folder found"
            find ios -maxdepth 2 -type f | head -50
          else
            echo "ERROR: ios folder not found"
            exit 1
          fi
