name: Boom Music - Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # CHECK BOOM MUSIC PROJECT
      # ==========================================
      - name: Check Boom Music files
        shell: bash
        run: |
          set -e

          echo "===== ROOT PROJECT ====="
          ls -la

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html tidak ditemukan."
            echo ""
            echo "Struktur yang benar:"
            echo ""
            echo "Musik-ibaal/"
            echo "├── index.html"
            echo "├── style.css"
            echo "├── app.js"
            echo "├── manifest.json"
            echo "├── service-worker.js"
            echo "├── js/"
            echo "├── assets/"
            echo "└── .github/"
            echo ""
            exit 1
          fi

          echo "OK: index.html ditemukan."

      # ==========================================
      # NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ==========================================
      # CREATE PACKAGE
      # ==========================================
      - name: Create package.json
        shell: bash
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/ios

      # ==========================================
      # CAPACITOR CONFIG
      # ==========================================
      - name: Create Capacitor config
        shell: bash
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ibaal.boommusic",
            "appName": "Boom Music",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      # ==========================================
      # COPY WEB PROJECT
      # ==========================================
      - name: Prepare web files
        shell: bash
        run: |
          rm -rf www
          mkdir -p www

          cp -R index.html www/

          [ -f style.css ] && cp style.css www/ || true
          [ -f app.js ] && cp app.js www/ || true
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f service-worker.js ] && cp service-worker.js www/ || true

          [ -d js ] && cp -R js www/ || true
          [ -d assets ] && cp -R assets www/ || true
          [ -d data ] && cp -R data www/ || true
          [ -d images ] && cp -R images www/ || true
          [ -d icons ] && cp -R icons www/ || true
          [ -d fonts ] && cp -R fonts www/ || true

          echo "===== WWW ====="
          find www -maxdepth 3 -type f | sort

      # ==========================================
      # ADD IOS
      # ==========================================
      - name: Create iOS project
        shell: bash
        run: |
          npx cap add ios

      # ==========================================
      # SYNC
      # ==========================================
      - name: Sync Capacitor
        shell: bash
        run: |
          npx cap sync ios

      # ==========================================
      # PATCH IOS SETTINGS
      # ==========================================
      - name: Configure iOS
        shell: bash
        run: |
          PROJECT="ios/App/App.xcodeproj/project.pbxproj"

          if [ -f "$PROJECT" ]; then

            sed -i '' \
              's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' \
              "$PROJECT"

            sed -i '' \
              's/ALWAYS_SEARCH_USER_PATHS = YES;/ALWAYS_SEARCH_USER_PATHS = NO;/g' \
              "$PROJECT"

          fi

      # ==========================================
      # PODS
      # ==========================================
      - name: Install CocoaPods
        shell: bash
        run: |
          cd ios/App

          pod install --repo-update

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build unsigned archive
        shell: bash
        run: |
          set -o pipefail

          mkdir -p output

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/output/BoomMusic.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=15.5 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # ==========================================
      # CREATE UNSIGNED IPA
      # ==========================================
      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          cd ios/App

          rm -rf Payload
          mkdir -p Payload

          cp -R \
            output/BoomMusic.xcarchive/Products/Applications/App.app \
            Payload/BoomMusic.app

          /usr/bin/zip -r \
            "$GITHUB_WORKSPACE/BoomMusic-unsigned.ipa" \
            Payload

          rm -rf Payload

          echo "===== IPA CREATED ====="
          ls -lh "$GITHUB_WORKSPACE/BoomMusic-unsigned.ipa"

      # ==========================================
      # UPLOAD IPA
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: BoomMusic-unsigned.ipa
          if-no-files-found: error

      # ==========================================
      # UPLOAD ARCHIVE
      # ==========================================
      - name: Upload Xcode Archive
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-XCArchive
          path: ios/App/output/BoomMusic.xcarchive
          if-no-files-found: error
