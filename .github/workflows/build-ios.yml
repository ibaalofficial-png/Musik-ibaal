name: Boom Music iOS Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build Boom Music iOS
    runs-on: macos-15

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # XCODE
      # ==========================================
      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          xcode-select -p


      # ==========================================
      # NODE
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm


      # ==========================================
      # INSTALL WEB DEPENDENCIES
      # ==========================================
      - name: Install npm dependencies
        run: |
          npm ci


      # ==========================================
      # CAPACITOR CHECK
      # ==========================================
      - name: Check Capacitor
        run: |
          npx cap --version
          npm list @capacitor/core
          npm list @capacitor/ios


      # ==========================================
      # SYNC CAPACITOR
      # ==========================================
      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios


      # ==========================================
      # CHECK IOS PROJECT
      # ==========================================
      - name: Check iOS project
        run: |
          echo "===== IOS DIRECTORY ====="
          ls -la

          echo "===== BUILD-IOS ====="
          ls -la build-ios || true

          echo "===== IOS PROJECT ====="
          find build-ios -maxdepth 4 \
            \( -name "*.xcodeproj" -o -name "Podfile" -o -name "Pods" \) \
            -print || true


      # ==========================================
      # INSTALL COCOAPODS
      # ==========================================
      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version


      # ==========================================
      # POD INSTALL
      # ==========================================
      - name: Install iOS Pods
        working-directory: build-ios/ios/App
        run: |
          pod deintegrate || true
          pod install --repo-update


      # ==========================================
      # VERIFY CAPACITOR POD
      # ==========================================
      - name: Verify Capacitor
        working-directory: build-ios/ios/App
        run: |
          echo "===== PODS ====="
          ls -la Pods || true

          echo "===== CAPACITOR ====="
          find Pods -maxdepth 3 \
            \( -iname "*Capacitor*" -o -iname "Capacitor.framework" \) \
            -print || true

          echo "===== PODFILE ====="
          cat Podfile


      # ==========================================
      # CLEAN
      # ==========================================
      - name: Clean Xcode
        working-directory: build-ios/ios/App
        run: |
          xcodebuild \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            clean


      # ==========================================
      # ARCHIVE
      # ==========================================
      - name: Archive Boom Music
        working-directory: build-ios/ios/App
        run: |
          mkdir -p ../../output

          xcodebuild \
            -workspace App.xcodeproj/project.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/build-ios/output/BoomMusic.xcarchive" \
            IPHONEOS_DEPLOYMENT_TARGET=15.5 \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS=NO \
            ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive


      # ==========================================
      # CREATE UNSIGNED IPA
      # ==========================================
      - name: Create unsigned IPA
        run: |
          set -e

          APP_PATH="build-ios/output/BoomMusic.xcarchive/Products/Applications/App.app"
          PAYLOAD="build-ios/output/Payload"

          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app tidak ditemukan!"
            exit 1
          fi

          cp -R "$APP_PATH" "$PAYLOAD/App.app"

          cd build-ios/output

          zip -qry BoomMusic-unsigned.ipa Payload

          rm -rf Payload

          echo "===== IPA CREATED ====="
          ls -lh BoomMusic-unsigned.ipa


      # ==========================================
      # UPLOAD ARCHIVE
      # ==========================================
      - name: Upload Xcode Archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-XCArchive
          path: build-ios/output/BoomMusic.xcarchive
          retention-days: 7


      # ==========================================
      # UPLOAD IPA
      # ==========================================
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoomMusic-IPA
          path: build-ios/output/BoomMusic-unsigned.ipa
          retention-days: 7
